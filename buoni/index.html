<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buoni MakerWorld</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mut:#6b7280;--acc:#00ae42;--bd:#e3e6eb}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--fg:#e8eaed;--mut:#9aa0a8;--bd:#2c313a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
form{display:flex;flex-wrap:wrap;gap:8px}
input,textarea,select{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
#code{flex:2 1 200px}#amount{flex:1 1 100px}
button{font:inherit;padding:10px 14px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--bd)}
textarea{width:100%;min-height:90px}
.tot{display:flex;gap:16px;flex-wrap:wrap;color:var(--mut)}
.tot b{color:var(--fg);font-size:1.2rem}
ul{list-style:none;padding:0;margin:0}
li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--bd)}
li:first-child{border-top:0}
li .c{flex:1 1 calc(100% - 110px);min-width:0;-webkit-user-select:text;user-select:text;font-family:ui-monospace,monospace;font-size:1.05rem;letter-spacing:.03em;overflow-wrap:anywhere}
li.used .c{text-decoration:line-through;color:var(--mut)}
li .a{font-weight:600;white-space:nowrap;margin-left:auto;font-size:1.1rem}
li button{padding:6px 10px;font-size:.85rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:8px;opacity:0;transition:.2s}
</style>
</head>
<body><main>
<h1>Buoni MakerWorld</h1>
<p id="sync" style="color:var(--mut);margin:-8px 0 12px;font-size:.9rem">⚠️ Salvataggio solo locale: accedi a claude.ai per salvare nel tuo account</p>
<div class="card">
 <form id="f">
  <input id="code" placeholder="Codice buono" autocomplete="off" autocapitalize="characters" spellcheck="false">
  <button type="button" class="sec" id="pasteBtn">Incolla</button>
  <input id="amount" type="text" inputmode="decimal" placeholder="Importo" autocomplete="off">
  <input id="desc" placeholder="Descrizione (facoltativa)" style="flex:1 1 100%">
  <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="res"> Tieni da parte</label>
  <button>Aggiungi</button>
 </form>
</div>
<div class="card">
 <div class="tot" style="margin-bottom:8px"><span>Credito disponibile (buoni riscattati): <b id="cNow">—</b></span><span id="cWhen"></span></div>
 <form id="cf"><input id="cred" type="text" inputmode="decimal" placeholder="Credito attuale" required style="flex:1 1 140px"><button>Aggiorna credito</button></form>
</div>
<div class="card">
 <div class="tot" style="margin-bottom:8px"><span>Punti attuali: <b id="pNow">—</b></span><span id="pDiff"></span></div>
 <form id="pf"><input id="pts" type="number" step="1" min="0" placeholder="Punti adesso" required style="flex:1 1 140px"><button>Salva punti</button></form>
 <details open style="margin-top:8px"><summary>Storico punti</summary><ul id="pList"></ul></details>
</div>
<div class="card">
 <label for="bulk">Incolla più buoni (una riga per buono: <code>CODICE importo</code>)</label>
 <textarea id="bulk" placeholder="ABCD-1234 5&#10;EFGH-5678 10"></textarea>
 <button id="imp" style="margin-top:8px">Importa</button>
</div>
<div class="card">
 <div class="tot"><span>Disponibili: <b id="tAv">0</b></span><span>Da parte: <b id="tRs">0</b></span><span>Usati: <b id="tUs">0</b></span></div>
</div>
<div class="card">
 <div class="bar">
  <select id="flt"><option value="av">Disponibili</option><option value="res">Da parte</option><option value="used">Usati</option><option value="all">Tutti</option></select>
  <button class="sec" id="copyAll">Copia disponibili</button>
  <button class="sec" id="exp">Esporta</button>
 </div>
 <ul id="list"></ul>
</div>
</main>
<div id="toast"></div>
<div id="cm" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:16px;z-index:9" onclick="if(event.target===this)this.style.display='none'">
 <div class="card" style="width:100%;max-width:420px">
  <p style="margin:0 0 8px">Tieni premuto sul testo e scegli <b>Copia</b>:</p>
  <textarea id="cmT" readonly style="min-height:60px;font-family:ui-monospace,monospace;-webkit-user-select:text;user-select:text"></textarea>
  <button style="margin-top:8px;width:100%" onclick="document.getElementById('cm').style.display='none'">Chiudi</button>
 </div>
</div>
<script>
const K='mw-buoni';let data=[];
try{data=JSON.parse(localStorage.getItem(K))||[]}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(data))}catch(e){}render();cloudSave()};
const fmt=n=>n.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1200)};
function copyFallback(t){const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';document.body.append(a);a.focus();a.select();a.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();if(ok)toast('Copiato!');else showCopy(t)}
function showCopy(t){const m=document.getElementById('cm'),i=document.getElementById('cmT');i.value=t;m.style.display='flex';i.focus();i.select();i.setSelectionRange(0,t.length)}
const copy=t=>{if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>toast('Copiato!'),()=>copyFallback(t));else copyFallback(t)};
const st=d=>d.used?'used':d.reserved?'res':'av';
function add(code,amount,desc='',reserved=false){code=code.trim();if(!code||isNaN(amount))return false;
 if(data.some(d=>d.code===code)){toast('Codice già presente');return false}
 data.unshift({code,amount,desc,reserved,used:false,date:Date.now()});return true}
document.getElementById('f').onsubmit=e=>{e.preventDefault();
 if(!code.value.trim()){toast('Inserisci il codice');return}
 if(isNaN(parseFloat(amount.value.replace(',','.')))){toast('Inserisci l\'importo');return}
 if(add(code.value,parseFloat(amount.value.replace(',','.')),desc.value.trim(),res.checked)){code.value='';amount.value='';desc.value='';res.checked=false;save();code.focus()}};
document.getElementById('pasteBtn').onclick=async()=>{try{const t=await navigator.clipboard.readText();if(t){const m=t.trim().match(/^(\S+)(?:[\s,;:\t-]+[€$]?\s*([\d.,]+))?/);code.value=m?m[1]:t.trim();if(m&&m[2])amount.value=parseFloat(m[2].replace(',','.'));amount.focus()}}catch(e){code.focus();toast('Tieni premuto nel campo e scegli Incolla')}};
document.getElementById('imp').onclick=()=>{let n=0;
 bulk.value.split('\n').forEach(l=>{const m=l.trim().match(/^(\S+)[\s,;:\t-]+[€$]?\s*([\d.,]+)/);if(m&&add(m[1],parseFloat(m[2].replace(',','.'))))n++});
 bulk.value='';save();toast(n+' buoni importati')};
document.getElementById('flt').onchange=render;
document.getElementById('copyAll').onclick=()=>copy(data.filter(d=>st(d)==='av').map(d=>d.code).join('\n'));
document.getElementById('exp').onclick=()=>copy(data.map(d=>d.code+' '+d.amount+(d.desc?' '+d.desc:'')+(d.used?' (usato)':d.reserved?' (da parte)':'')).join('\n'));
function render(){const f=flt.value,ul=document.getElementById('list');ul.innerHTML='';
 const sum=k=>fmt(data.filter(d=>st(d)===k).reduce((s,d)=>s+d.amount,0));
 tAv.textContent=sum('av');tRs.textContent=sum('res');
 tUs.textContent=sum('used');
 data.filter(d=>f==='all'||st(d)===f).forEach(d=>{
  const li=document.createElement('li');if(d.used)li.className='used';
  li.innerHTML=`<span class="c"></span><span class="a">${fmt(d.amount)}</span>`;
  li.querySelector('.c').textContent=d.code;
  if(d.desc){const s=document.createElement('small');s.style.cssText='display:block;color:var(--mut);font-family:system-ui';s.textContent=d.desc;li.querySelector('.c').append(s)}
  const b=(t,fn,c)=>{const x=document.createElement('button');x.textContent=t;if(c)x.className=c;x.onclick=fn;li.append(x)};
  b('Copia',()=>copy(d.code));
  if(!d.used)b(d.reserved?'Sblocca':'Da parte',()=>{d.reserved=!d.reserved;if(d.reserved){const t=prompt('Descrizione',d.desc||'');if(t!==null)d.desc=t.trim()}save()},'sec');
  b(d.used?'Ripristina':'Usato',()=>{d.used=!d.used;save()},'sec');
  b('✕',()=>{if(confirm('Eliminare '+d.code+'?')){data=data.filter(x=>x!==d);save()}},'sec');
  ul.append(li)});
 if(!ul.children.length)ul.innerHTML='<li style="color:var(--mut)">Nessun buono</li>'}
const PK='mw-punti';let pts=[];
try{pts=JSON.parse(localStorage.getItem(PK))||[]}catch(e){}
function pRender(){const l=document.getElementById('pList');l.innerHTML='';
 pNow.textContent=pts.length?pts[0].p.toLocaleString('it-IT'):'—';
 pDiff.textContent=pts.length>1?((pts[0].p-pts[1].p>=0?'+':'')+(pts[0].p-pts[1].p).toLocaleString('it-IT')+' dall\'ultima volta'):'';
 pts.forEach((x,i)=>{const li=document.createElement('li');
  li.innerHTML=`<span class="c" style="font-family:system-ui">${new Date(x.t).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'})}</span><span class="a">${x.p.toLocaleString('it-IT')}</span>`;
  if(i<pts.length-1){const d=x.p-pts[i+1].p,s=document.createElement('span');s.textContent=(d>=0?'+':'')+d.toLocaleString('it-IT');s.style.cssText='font-weight:600;margin:0 auto;color:'+(d>0?'var(--acc)':d<0?'#d33':'var(--mut)');li.querySelector('.a').before(s)}
  li.style.flexWrap='nowrap';li.querySelector('.c').style.flex='0 1 auto';
  const b=document.createElement('button');b.className='sec';b.textContent='✕';b.onclick=()=>{if(confirm('Eliminare questa voce?')){pts.splice(i,1);pSave()}};li.append(b);l.append(li)});
 if(!pts.length)l.innerHTML='<li style="color:var(--mut)">Nessuna voce</li>'}
function pSave(){try{localStorage.setItem(PK,JSON.stringify(pts))}catch(e){}pRender();cloudSave()}
document.getElementById('pf').onsubmit=e=>{e.preventDefault();const v=parseInt(document.getElementById('pts').value,10);if(isNaN(v))return;pts.unshift({p:v,t:Date.now()});document.getElementById('pts').value='';pSave();toast('Punti salvati')};
const CK='mw-credito';let cr=null;
try{cr=JSON.parse(localStorage.getItem(CK))}catch(e){}
function cRender(){cNow.textContent=cr?fmt(cr.v):'—';cWhen.textContent=cr?'aggiornato '+new Date(cr.t).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'}):''}
document.getElementById('cf').onsubmit=e=>{e.preventDefault();const v=parseFloat(cred.value.replace(',','.'));if(isNaN(v))return;cr={v,t:Date.now()};try{localStorage.setItem(CK,JSON.stringify(cr))}catch(e){}cred.value='';cRender();cloudSave();toast('Credito aggiornato')};
let cloudRef=null,cloudT=null;
function cloudSave(){if(!cloudRef)return;clearTimeout(cloudT);cloudT=setTimeout(()=>cloudRef.set({buoni:data,punti:pts,credito:cr}).catch(()=>toast('Salvataggio online non riuscito')),400)}
(async()=>{try{const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;const id=await user.id();if(!id)return;
 const ref=db.collection('data/users/'+id).doc('stato');const s=await ref.get();
 if(s.exists){const d=s.data();data=d.buoni||[];pts=d.punti||[];cr=d.credito||null;
  try{localStorage.setItem(K,JSON.stringify(data));localStorage.setItem(PK,JSON.stringify(pts));localStorage.setItem(CK,JSON.stringify(cr))}catch(e){}
  render();pRender();cRender()}
 cloudRef=ref;if(!s.exists&&(data.length||pts.length||cr))cloudSave();
 document.getElementById('sync').textContent='☁️ Salvato nel tuo account'}catch(e){}})();
cRender();
pRender();
render();
</script>
</body></html>
