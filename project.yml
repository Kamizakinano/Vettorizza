name: MakerDash
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
targets:
  MakerDash:
    type: application
    platform: iOS
    sources: [MakerDash/Sources, MakerDash/Shared]
    dependencies:
      - target: MakerDashWidget
    info:
      path: MakerDash/Info.plist
      properties:
        CFBundleDisplayName: MakerDash
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.personal.makerdash.refresh]
        MARKETING_VERSION_DISPLAY: "0.2"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.makerdash
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MakerDashWidget:
    type: app-extension
    platform: iOS
    sources: [MakerDashWidget, MakerDash/Shared]
    info:
      path: MakerDashWidget/Info.plist
      properties:
        CFBundleDisplayName: MakerDash
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.makerdash.widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: "NO"
