name: MakerDash
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
targets:
  MakerDash:
    type: application
    platform: iOS
    sources: [MakerDash/Sources]
    info:
      path: MakerDash/Info.plist
      properties:
        CFBundleDisplayName: MakerDash
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.personal.makerdash.refresh]
        MARKETING_VERSION_DISPLAY: "0.2"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.makerdash
        MARKETING_VERSION: "0.9.3"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: "NO"
