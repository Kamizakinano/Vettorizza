[project]
name = "vettorizza"
version = "1.0.0"
description = "Da immagine a vettoriale (SVG/DXF) e a modello 3D multicolore (3MF/OBJ/STL) per Fusion 360 e Bambu Studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "Pillow>=10.0",
    "PySide6-Essentials>=6.6",
    "mapbox_earcut>=1.0.1",
    "ezdxf>=1.1",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.5"]

[project.gui-scripts]
vettorizza = "vettorizza.gui.app:main"

[project.scripts]
vettorizza-cli = "vettorizza.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vettorizza*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
