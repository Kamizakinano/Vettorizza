name: Statistiche orarie

# I cron di GitHub sono spesso in ritardo o saltati: il job resta attivo circa 5h45,
# salva un campione ogni 10 minuti e poi si riavvia da solo. Il cron serve solo da riserva.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hourly-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Prepara branch dati
        run: |
          git config --global user.name "makerdash-bot"
          git config --global user.email "makerdash-bot@users.noreply.github.com"
          if git ls-remote --exit-code origin stats-data; then
            git fetch origin stats-data && git worktree add data origin/stats-data && (cd data && git checkout -B stats-data)
          else
            git worktree add --orphan -b stats-data data
          fi
      - name: Raccogli ogni 10 minuti
        run: |
          end=$(( $(date +%s) + 340*60 ))
          while [ $(date +%s) -lt $end ]; do
            python3 scripts/collect_hourly.py Kamy29 1204206395 data/hourly/Kamy29.json || true
            (cd data && git add -A && git commit -qm "Dati $(date -u +%FT%TZ)" && (git push -q origin stats-data || (git pull -q --rebase origin stats-data && git push -q origin stats-data))) || true
            sleep 600
          done
      - name: Riavvia
        if: always()
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/hourly-stats.yml/dispatches \
            -d '{"ref":"${{ github.ref_name }}"}'
